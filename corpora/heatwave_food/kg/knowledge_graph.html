<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Knowledge graph (heatwave_food)</title>
  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    header { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; background: #fff; }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 0.85rem; color: #64748b; }
    #mynetwork { width: 100%; height: calc(100vh - 64px); position: relative; }
    #tooltip {
      display: none;
      position: fixed;
      z-index: 20;
      max-width: min(420px, 80vw);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.85rem;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
      pointer-events: none;
      white-space: normal;
    }
    /* Hide any leftover vis built-in tooltip */
    div.vis-tooltip { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Knowledge graph (heatwave_food)</h1>
    <p>9 nodes · 10 edges — drag, zoom, hover</p>
  </header>
  <div id="mynetwork"></div>
  <div id="tooltip"></div>
  <script>
    const payload = {"nodes": [{"id": "term:one health", "label": "One Health", "tooltip": "One Health (cluster weight 3.2; n_papers 3)", "value": 11.2, "group": "Term"}, {"id": "paper:europe_pmc_PMC12616928", "label": "PMC12616928", "tooltip": "The silent microbial shift: climate change amplifies pathogen evolution, microbiome dysbiosis, and antimicrobial resistance.<br>(PMC12616928)", "value": 12.0, "group": "Paper"}, {"id": "paper:europe_pmc_PMC13708365", "label": "PMC13708365", "tooltip": "&lt;i&gt;Vibrio parahaemolyticus&lt;/i&gt; in a Changing World: A One Health Perspective on Epidemiology, Antimicrobial Resistance, Virulence, and Climate-Driven Risks.<br>(PMC13708365)", "value": 12.0, "group": "Paper"}, {"id": "term:united states", "label": "United States", "tooltip": "United States (cluster weight 1.3; n_papers 2)", "value": 9.3, "group": "Term"}, {"id": "term:health", "label": "Health", "tooltip": "Health (cluster weight 1.07; n_papers 2)", "value": 9.07, "group": "Term"}, {"id": "term:climate", "label": "Climate", "tooltip": "Climate (cluster weight 0.0344; n_papers 2)", "value": 8.0344, "group": "Term"}, {"id": "term:british columbia", "label": "British Columbia", "tooltip": "British Columbia (cluster weight 3.5; n_papers 3)", "value": 11.5, "group": "Term"}, {"id": "paper:europe_pmc_PMC13219836", "label": "PMC13219836", "tooltip": "A chromosome-level reference genome for Pacific herring (&lt;i&gt;Clupea pallasii)&lt;/i&gt; from the Bering Sea.<br>(PMC13219836)", "value": 12.0, "group": "Paper"}, {"id": "paper:europe_pmc_PMC13688465", "label": "PMC13688465", "tooltip": "Evaluating Kelp Feedstock for Alginate-Based Materials: Physicochemical Characterization of Sodium Alginate and Aquaculture Considerations.<br>(PMC13688465)", "value": 12.0, "group": "Paper"}], "edges": [{"from": "paper:europe_pmc_PMC12616928", "to": "term:one health", "value": 3.2}, {"from": "paper:europe_pmc_PMC13708365", "to": "term:one health", "value": 3.2}, {"from": "paper:europe_pmc_PMC12616928", "to": "term:united states", "value": 1.3}, {"from": "paper:europe_pmc_PMC13708365", "to": "term:united states", "value": 1.3}, {"from": "paper:europe_pmc_PMC12616928", "to": "term:health", "value": 1.07}, {"from": "paper:europe_pmc_PMC13708365", "to": "term:health", "value": 1.07}, {"from": "paper:europe_pmc_PMC12616928", "to": "term:climate", "value": 0.0344}, {"from": "paper:europe_pmc_PMC13708365", "to": "term:climate", "value": 0.0344}, {"from": "paper:europe_pmc_PMC13219836", "to": "term:british columbia", "value": 3.5}, {"from": "paper:europe_pmc_PMC13688465", "to": "term:british columbia", "value": 3.5}], "title": "Knowledge graph (heatwave_food)"};
    const nodes = new vis.DataSet(payload.nodes);
    const edges = new vis.DataSet(payload.edges);
    const container = document.getElementById('mynetwork');
    const tip = document.getElementById('tooltip');
    const network = new vis.Network(
      container,
      { nodes, edges },
      {
        nodes: {
          shape: 'dot',
          font: { size: 14, color: '#0f172a' },
          borderWidth: 2,
          scaling: { min: 8, max: 36 }
        },
        edges: {
          color: { color: '#94a3b8', highlight: '#2563eb' },
          smooth: { type: 'continuous' }
        },
        groups: {
          Paper: { color: { background: '#fdba74', border: '#c2410c' } },
          Term: { color: { background: '#93c5fd', border: '#1d4ed8' } },
          Encyclopedia: { color: { background: '#86efac', border: '#15803d' } }
        },
        physics: {
          stabilization: true,
          barnesHut: {
            gravitationalConstant: -2500,
            springLength: 95,
            springConstant: 0.04
          }
        },
        interaction: { hover: true, navigationButtons: true }
      }
    );

    function showTip(html, evt) {
      if (!html) {
        tip.style.display = 'none';
        return;
      }
      tip.innerHTML = html;
      tip.style.display = 'block';
      const pad = 14;
      let x = (evt && evt.clientX != null ? evt.clientX : 0) + pad;
      let y = (evt && evt.clientY != null ? evt.clientY : 0) + pad;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
      const rect = tip.getBoundingClientRect();
      if (rect.right > window.innerWidth - 8) {
        tip.style.left = Math.max(8, window.innerWidth - rect.width - 8) + 'px';
      }
      if (rect.bottom > window.innerHeight - 8) {
        tip.style.top = Math.max(8, window.innerHeight - rect.height - 8) + 'px';
      }
    }

    network.on('hoverNode', function (params) {
      const node = nodes.get(params.node);
      const html = (node && (node.tooltip || node.label)) || '';
      showTip(html, params.event && params.event.srcEvent);
    });
    network.on('blurNode', function () {
      tip.style.display = 'none';
    });
    network.on('dragStart', function () {
      tip.style.display = 'none';
    });
    container.addEventListener('mousemove', function (evt) {
      if (tip.style.display === 'block') {
        showTip(tip.innerHTML, evt);
      }
    });
  </script>
</body>
</html>
