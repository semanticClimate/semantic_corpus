p": "Supplementary Information (cluster weight 2.7; n_papers 2)", "value": 10.7, "group": "Term"}, {"id": "paper:europe_pmc_PMC13428007", "label": "PMC13428007", "tooltip": "Agrochemical residues and food safety: In-depth in silico assessment of the degradation mechanism of chlorpyrifos-oxon by niobium dioxide (NbO₂), a naturally occurring and cost-effective mineral.<br>(PMC13428007)", "value": 12.0, "group": "Paper"}, {"id": "paper:europe_pmc_PMC13600945", "label": "PMC13600945", "tooltip": "Phosphine-mediated azine C-H couplings with water and ammonia.<br>(PMC13600945)", "value": 12.0, "group": "Paper"}, {"id": "term:ts", "label": "TS", "tooltip": "TS (cluster weight 2.32; n_papers 2)", "value": 10.32, "group": "Term"}, {"id": "term:reaction", "label": "Reaction", "tooltip": "Reaction (cluster weight 0.0968; n_papers 2)", "value": 8.0968, "group": "Term"}], "edges": [{"from": "paper:europe_pmc_PMC12922021", "to": "term:ppe", "value": 2.54}, {"from": "paper:europe_pmc_PMC13208927", "to": "term:ppe", "value": 2.54}, {"from": "paper:europe_pmc_PMC13520464", "to": "term:ppe", "value": 2.54}, {"from": "paper:europe_pmc_PMC12922021", "to": "term:world health organization", "value": 2.3}, {"from": "paper:europe_pmc_PMC13208927", "to": "term:world health organization", "value": 2.3}, {"from": "paper:europe_pmc_PMC13520464", "to": "term:world health organization", "value": 2.3}, {"from": "paper:europe_pmc_PMC12922021", "to": "term:declaration of helsinki", "value": 2.2}, {"from": "paper:europe_pmc_PMC13208927", "to": "term:declaration of helsinki", "value": 2.2}, {"from": "paper:europe_pmc_PMC13520464", "to": "term:declaration of helsinki", "value": 2.2}, {"from": "paper:europe_pmc_PMC13510588", "to": "term:nps", "value": 5.26}, {"from": "paper:europe_pmc_PMC13679550", "to": "term:nps", "value": 5.26}, {"from": "paper:europe_pmc_PMC13707692", "to": "term:nps", "value": 5.26}, {"from": "paper:europe_pmc_PMC13510588", "to": "term:or", "value": 2.64}, {"from": "paper:europe_pmc_PMC13679550", "to": "term:or", "value": 2.64}, {"from": "paper:europe_pmc_PMC13707692", "to": "term:or", "value": 2.64}, {"from": "paper:europe_pmc_PMC12596878", "to": "term:ci", "value": 2.5}, {"from": "paper:europe_pmc_PMC13387539", "to": "term:ci", "value": 2.5}, {"from": "paper:europe_pmc_PMC13427916", "to": "term:uv", "value": 2.58}, {"from": "paper:europe_pmc_PMC13676021", "to": "term:uv", "value": 2.58}, {"from": "paper:europe_pmc_PMC13427916", "to": "term:united states", "value": 1.5}, {"from": "paper:europe_pmc_PMC13676021", "to": "term:united states", "value": 1.5}, {"from": "paper:europe_pmc_PMC13427916", "to": "term:cancer", "value": 0.052}, {"from": "paper:europe_pmc_PMC13676021", "to": "term:cancer", "value": 0.052}, {"from": "paper:europe_pmc_PMC13427916", "to": "term:exposure", "value": 0.0498}, {"from": "paper:europe_pmc_PMC13676021", "to": "term:exposure", "value": 0.0498}, {"from": "paper:europe_pmc_PMC13428007", "to": "term:supplementary information", "value": 2.7}, {"from": "paper:europe_pmc_PMC13600945", "to": "term:supplementary information", "value": 2.7}, {"from": "paper:europe_pmc_PMC13428007", "to": "term:ts", "value": 2.32}, {"from": "paper:europe_pmc_PMC13600945", "to": "term:ts", "value": 2.32}, {"from": "paper:europe_pmc_PMC13428007", "to": "term:reaction", "value": 0.0968}, {"from": "paper:europe_pmc_PMC13600945", "to": "term:reaction", "value": 0.0968}], "title": "Knowledge graph (agrochemicals)"};
    const nodes = new vis.DataSet(payload.nodes);
    const edges = new vis.DataSet(payload.edges);
    const container = document.getElementById('mynetwork');
    const tip = document.getElementById('tooltip');
    const network = new vis.Network(
      container,
      { nodes, edges },
      {
        nodes: {
          shape: 'dot',
          font: { size: 14, color: '#0f172a' },
          borderWidth: 2,
          scaling: { min: 8, max: 36 }
        },
        edges: {
          color: { color: '#94a3b8', highlight: '#2563eb' },
          smooth: { type: 'continuous' }
        },
        groups: {
          Paper: { color: { background: '#fdba74', border: '#c2410c' } },
          Term: { color: { background: '#93c5fd', border: '#1d4ed8' } },
          Encyclopedia: { color: { background: '#86efac', border: '#15803d' } }
        },
        physics: {
          stabilization: true,
          barnesHut: {
            gravitationalConstant: -2500,
            springLength: 95,
            springConstant: 0.04
          }
        },
        interaction: { hover: true, navigationButtons: true }
      }
    );

    function showTip(html, evt) {
      if (!html) {
        tip.style.display = 'none';
        return;
      }
      tip.innerHTML = html;
      tip.style.display = 'block';
      const pad = 14;
      let x = (evt && evt.clientX != null ? evt.clientX : 0) + pad;
      let y = (evt && evt.clientY != null ? evt.clientY : 0) + pad;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
      const rect = tip.getBoundingClientRect();
      if (rect.right > window.innerWidth - 8) {
        tip.style.left = Math.max(8, window.innerWidth - rect.width - 8) + 'px';
      }
      if (rect.bottom > window.innerHeight - 8) {
        tip.style.top = Math.max(8, window.innerHeight - rect.height - 8) + 'px';
      }
    }

    network.on('hoverNode', function (params) {
      const node = nodes.get(params.node);
      const html = (node && (node.tooltip || node.label)) || '';
      showTip(html, params.event && params.event.srcEvent);
    });
    network.on('blurNode', function () {
      tip.style.display = 'none';
    });
    network.on('dragStart', function () {
      tip.style.display = 'none';
    });
    container.addEventListener('mousemove', function (evt) {
      if (tip.style.display === 'block') {
        showTip(tip.innerHTML, evt);
      }
    });
  </script>
</body>
</html>
