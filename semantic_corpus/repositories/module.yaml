name: repositories
title: Literature repositories
summary: >
  Repository adapters that harvest papers into the shared corpus contracts,
  including Europe PMC plus Global South and non-EN-centric sources
  (SciELO, Redalyc, CONICET, and related IRs).
owner: Larisa Beni
co_authors:
  - Renu Kumari
  - Peter Murray-Rust
status: extension
python_extra: repositories
depends_on:
  - corpus
docs: docs/modules/repositories/overview.md
legacy_paths:
  - semantic_corpus/repositories
facilities:
  - id: europe_pmc
    title: Europe PMC
    summary: Open Europe PMC search and full-text download.
    entry: semantic_corpus.repositories.europe_pmc
  - id: openalex
    title: OpenAlex
    summary: OpenAlex works intake into corpus contracts.
    entry: semantic_corpus.repositories.openalex
  - id: scielo
    title: SciELO
    summary: SciELO adapter for Global South open literature.
    entry: semantic_corpus.repositories.scielo
  - id: redalyc
    title: Redalyc
    summary: Redalyc adapter for Latin American journals.
    entry: semantic_corpus.repositories.redalyc
  - id: conicet
    title: CONICET
    summary: CONICET / DSpace-style institutional harvest.
    entry: semantic_corpus.repositories.conicet
  - id: la_irs
    title: Latin American IRs
    summary: University IR scrapers (UBA, USP, UNAL, UNAM, UChile, Kerwa, …).
    entry: semantic_corpus.repositories
  - id: ids
    title: Paper ID helpers
    summary: Shared paper_id stems and document-presence checks.
    entry: semantic_corpus.repositories._ids
